[package]
name = "phasecraft"
version = "0.1.0"
edition = "2024"
description = "Deterministic procedural MIDI rhythm systems"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
midir = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
self-replace = "1.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = { version = "0.9", features = ["preserve_order"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
