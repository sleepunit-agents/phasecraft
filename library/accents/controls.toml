# Musical responses only; CC numbers belong to output.controls in the composition/kit.
[profiles."accent.filter_punch"]
base = 72
boost = 30
[profiles."accent.filter_punch".controls.filter]
base = 0.20
boost = 0.65
[profiles."accent.filter_punch".controls.envelope]
base = 0.15
boost = 0.55

# A control envelope with memory, not a pitched TB-303 emulation.
[profiles."accent.memory_punch"]
base = 75
boost = 15
controls.cutoff = { base = 0.2, boost = 0.55, envelope = { decay_beats = 2, accumulation = 0.5 } }
