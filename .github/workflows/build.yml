name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.name }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: E16 Lua adapter simulation
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install lupa==2.5
          python3 tools/controllers/test_script.py
          python3 tools/controllers/test_kit_script.py
      - run: cargo build --locked --release
      - name: Package Unix executable
        if: runner.os != 'Windows'
        run: |
          mkdir -p package/examples
          cp target/release/phasecraft README.md package/
          cp -R examples/. package/examples/
          cp -R docs package/docs
          tar -czf phasecraft-${{ matrix.name }}.tar.gz -C package .
          cp target/release/phasecraft phasecraft-update-${{ matrix.name }}.bin
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/examples
          Copy-Item target/release/phasecraft.exe, README.md package/
          Copy-Item examples/* package/examples/ -Recurse
          Copy-Item docs package/ -Recurse
          Compress-Archive -Path package/* -DestinationPath phasecraft-${{ matrix.name }}.zip
          Copy-Item target/release/phasecraft.exe phasecraft-update-${{ matrix.name }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: phasecraft-${{ matrix.name }}
          path: |
            phasecraft-*.tar.gz
            phasecraft-*.zip
            phasecraft-update-*.bin
            phasecraft-update-*.exe
          if-no-files-found: error

  desktop:
    name: Player (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            bundles: deb,appimage
          - os: windows-latest
            name: windows-x64
            bundles: nsis
          - os: macos-15
            name: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            name: macos-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: player-${{ matrix.name }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo fmt --check
        working-directory: desktop
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop
      - run: cargo test --locked
        working-directory: desktop
      - name: Browser interaction tests
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Build native installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPIMAGE_EXTRACT_AND_RUN: "1"
        shell: bash
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            npm run tauri -- build --bundles ${{ matrix.bundles }} --ci --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npm run tauri -- build --bundles ${{ matrix.bundles }} --ci
          fi
      - name: Native player smoke test
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked
          python3 -m pip install selenium
          xvfb-run -a python3 desktop/tests/native.py desktop/target/release/phasecraft-player
      - name: Collect installer
        if: github.event_name != 'pull_request'
        run: python .github/scripts/player-package.py ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: phasecraft-player-${{ matrix.name }}
          path: player-assets/*
          if-no-files-found: error

  dev-release:
    name: Update rolling dev release
    needs: [native, desktop]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: phasecraft-dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phasecraft-*
          merge-multiple: true
          path: release-assets
      - name: Publish tested native packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-dev.sh
