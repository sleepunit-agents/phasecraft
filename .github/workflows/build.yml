name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Package Unix executable
        if: runner.os != 'Windows'
        run: |
          mkdir -p package/examples
          cp target/release/phasecraft README.md package/
          cp -R examples/. package/examples/
          cp -R docs package/docs
          tar -czf phasecraft-${{ matrix.name }}.tar.gz -C package .
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/examples
          Copy-Item target/release/phasecraft.exe, README.md package/
          Copy-Item examples/* package/examples/ -Recurse
          Copy-Item docs package/ -Recurse
          Compress-Archive -Path package/* -DestinationPath phasecraft-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: phasecraft-${{ matrix.name }}
          path: |
            phasecraft-*.tar.gz
            phasecraft-*.zip
          if-no-files-found: error

  dev-release:
    name: Update rolling dev release
    needs: native
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: phasecraft-dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phasecraft-*
          merge-multiple: true
          path: release-assets
      - name: Publish tested native packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-dev.sh
