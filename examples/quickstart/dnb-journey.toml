# Thirty-two-bar procedural percussion journey. Uses Phasecraft 909 Prepared.als.
# The validated 909 dnb beat. Each table name is a stable musical identity.
tempo = 172
seed = 172909
phrase_bars = 4

[accents.drums]
rhythm = { steps = 7, pulses = 3 }
probability = 0.85
amount = 0.8

[parts.kick]
use = "my.dnb_kick"

[parts.snare]
use = "dnb.snare"

[parts.closed_hat]
compose = ["dnb.closed_hat", "kit.prepared.closed_hat", "my.percussion_motion", "my.percussion_memory"]
groove.delay_ticks = 8
groove.humanize = { timing_ticks = 5, velocity = 0.05 }
groove.offbeat_gain = 1.1

[parts.open_hat]
use = "dnb.open_hat"

[parts.rim]
compose = ["dnb.rim", "kit.prepared.rim", "my.percussion_motion", "my.percussion_memory"]
groove.delay_ticks = 8
groove.humanize = { timing_ticks = 5, velocity = 0.05 }
groove.offbeat_gain = 1.1

[phrases.Intro]
parts.closed_hat.parameters.cutoff = { value = 0.12, ramp = { to = 0.65, over_bars = 8 } }
parts.closed_hat.parameters.level = { value = 0.3, ramp = { to = 0.85, over_bars = 8 } }
parts.rim.trigger.probability = 0.25

[phrases.A]

[phrases.B]
parts.kick.trigger.probability = 0.0
parts.closed_hat.trigger.probability = 0.6
parts.rim.parameters.decay = { value = 0.8 }
parts.rim.parameters.cutoff = { value = 0.65, ramp = { to = 0.2, over_bars = 4 } }

[phrases.A2]
use = "A"
parts.rim.trigger.probability = 0.8
parts.closed_hat.accent.amount = 0.9

[phrases.Outro]
use = "A"
parts.closed_hat.parameters.cutoff = { value = 0.65, ramp = { to = 0.05, over_bars = 4 } }
parts.closed_hat.parameters.level = { value = 0.85, ramp = { to = 0.1, over_bars = 4 } }
parts.rim.parameters.level = { value = 0.85, ramp = { to = 0.1, over_bars = 4 } }

[arrangement]
# Set repeat=true to turn this into a live performance cycle.
repeat = false
sections = [
  { phrase = "Intro", bars = 8 },
  { phrase = "A", bars = 8, phase = "continue" },
  { phrase = "B", bars = 4 },
  { phrase = "A2", bars = 8, phase = "continue" },
  { phrase = "Outro", bars = 4 },
]

# Reusable musical ideas. Keep related patterns together in one file.
# These inherit the proven beats; tune a shared behavior here, or a Part locally.
[library.behaviors."my.techno_kick"]
compose = ["techno.kick", "my.kit.kick"]

[library.behaviors."my.dnb_kick"]
compose = ["dnb.kick", "my.kit.kick"]

# Example of a pattern without a MIDI destination: combine it with a kit component.
[library.behaviors."my.backbeat".trigger]
rhythm = { steps = 16, pulses = 2, rotation = 4 }

# Shared timing feel: every garage Part using this component follows this setting.
[library.behaviors."my.garage_swing"]
use = "groove.ukg"
groove.swing = 0.58

# Ableton 909 Core Kit pad mapping. Add other kit components as needed.
# Connections/ports belong in config/midi.toml; musical pad mappings live here.
[library.behaviors."my.kit.kick".output]
channel = 10
note = 36

# compact-v1: notes on channel 10; controls on 15/16. Defaults restore on Stop.
[library.behaviors."kit.prepared.kick".output]
note = 36
channel = 10
controls.cutoff = { cc = 20, channel = 15, default = 1.0 }
controls.level = { cc = 22, channel = 15, default = 1.0 }
controls.pan = { cc = 25, channel = 15, default = 0.5 }
