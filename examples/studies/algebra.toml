# All five Boolean operators; distinct voices share the same two source cycles.
tempo = 132
seed = 909
phrase_bars = 4

[[parts]]
id = "kick"
use = "techno.kick"

[[parts]]
id = "or"
compose = ["kit.909.rim", "std.no_accent"]
[parts.trigger]
rhythm = { type = "binary", op = "or", a = { type = "euclidean", steps = 16, pulses = 5, rotation = 0, reset_on_phrase = false }, b = { type = "euclidean", steps = 7, pulses = 2, rotation = -1, reset_on_phrase = false } }
probability = 1.0
probability_mode = "phrase_locked"
[parts.accent]
rhythm = { type = "euclidean", steps = 5, pulses = 2, rotation = 0, reset_on_phrase = false }
probability = 0.75
[parts.profile]
use = "accent.subtle"

[[parts]]
id = "and"
